version: "2"
linters:
  default: all
  disable:
    - cyclop
    - depguard
    - exhaustruct
    - funlen
    - gochecknoglobals
    - gocognit
    - goconst
    - gocyclo
    - noinlineerr
    - nonamedreturns
    - tagliatelle
    - varnamelen
    - wsl
    - wsl_v5
  settings:
    cyclop:
      max-complexity: 20
      package-average: 20
    funlen:
      lines: 80
      statements: 50
      ignore-comments: true
    gocognit:
      min-complexity: 40
    lll:
      line-length: 180
    nestif:
      min-complexity: 10
    staticcheck:
      checks:
        - all
        - -S1008
    wrapcheck:
      ignore-sig-regexps:
        - unix.*?\(
        - os.*?\(
        - filepath.*?\(
        - afero.*?\(
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - linters:
          - dupl
          - err113
          - gosmopolitan
          - ireturn
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
